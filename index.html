<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--tx:#e8eaf0;--mut:#8b91a0;--acc:#4ade80;--acc2:#22c55e;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:120px}
#app{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px}
.ver{font-size:12px;font-weight:400;color:var(--mut);margin-left:6px}
.tabs{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:15px}
.tabs button.on{color:#0b1f12;background:var(--acc);border-color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.exh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--mut)}.small{font-size:13px}
.hint{color:var(--acc);font-size:13px;margin:2px 0 6px}
.hint.bump.deload{color:var(--warn);border-color:var(--warn);background:#2a2008}
.plates{margin:4px 0 2px}
.hint.bump{display:block;width:100%;text-align:left;background:#0b1f12;border:1px solid var(--acc);border-radius:10px;padding:10px 12px;min-height:44px}
.pill{background:#0b1f12;color:var(--acc);border-radius:99px;padding:2px 10px;font-variant-numeric:tabular-nums;font-size:14px;margin-left:8px}
.set{display:flex;align-items:center;gap:6px;margin:6px 0}
.set .n{width:20px;color:var(--mut);text-align:center}
.set input{width:72px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:#0f1115;color:var(--tx);font-size:17px;text-align:center}
.set .u{color:var(--mut);font-size:13px;margin-right:4px}
.chk{margin-left:auto;width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:#0f1115;color:var(--mut);font-size:20px}
.set.next{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
.set.done input{opacity:.55}
.chk.on{background:var(--acc);color:#0b1f12;border-color:var(--acc)}
button{font:inherit;cursor:pointer}
.big{width:100%;padding:14px;border-radius:12px;border:0;background:var(--acc);color:#0b1f12;font-weight:700;font-size:17px;margin:6px 0}
.alt{background:#1f2937;color:var(--tx);border:1px solid var(--line)}
.ghost{background:transparent;border:1px dashed var(--line);color:var(--mut);border-radius:10px;padding:8px 12px;margin-top:4px}
.danger{color:var(--bad);border-color:var(--bad)}
#restbar{position:fixed;left:0;right:0;bottom:0;background:#0b1f12;border-top:1px solid var(--acc);padding:14px;text-align:center;font-size:20px;color:var(--acc);display:none;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#restbar.on{display:block}
.bar{height:10px;background:#0f1115;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc)}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0f1115;color:var(--tx);font-size:16px;margin-bottom:8px}
svg{width:100%;height:auto;display:block}
.row{display:flex;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:9}
</style>
</head>
<body>
<div id="app">
  <h1>🏋️ Gym Log <span class="ver" id="ver"></span></h1>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<div id="restbar"></div>
<script>
const APP_VERSION='1.3.2'; // bump on every change
const KEY='gymlog.v1';
const PLAN={
 A:{name:'Session A',ex:[
  {id:'goblet',rest:120,n:'Goblet squat (or leg press)',sets:3,reps:10,t:'kg'},
  {id:'chest',rest:90,n:'Chest press (DB or machine)',sets:3,reps:10,t:'kg'},
  {id:'row',rest:90,n:'Seated cable row',sets:3,reps:10,t:'kg'},
  {id:'rdl',rest:120,n:'Romanian deadlift (DB)',sets:3,reps:10,t:'kg'},
  {id:'curl',rest:60,n:'DB biceps curl',sets:2,reps:12,t:'kg'},
  {id:'pallof',rest:60,n:'Pallof press (each side)',sets:3,reps:10,t:'kg'}]},
 B:{name:'Session B',ex:[
  {id:'legpress',rest:120,n:'Leg press (or split squat)',sets:3,reps:10,t:'kg'},
  {id:'ohp',rest:90,n:'DB shoulder press',sets:3,reps:10,t:'kg'},
  {id:'lat',rest:90,n:'Lat pulldown',sets:3,reps:10,t:'kg'},
  {id:'deadlift',rest:150,bar:20,n:'Deadlift (barbell)',sets:3,reps:8,t:'kg'},
  {id:'face',rest:60,n:'Face pulls',sets:3,reps:15,t:'kg'},
  {id:'pushdown',rest:60,n:'Triceps pushdown (cable)',sets:2,reps:12,t:'kg'},
  {id:'carry',rest:90,n:"Farmer's carry (reps = metres)",sets:3,reps:30,t:'kg'}]}
};
const ALL=[].concat(PLAN.A.ex,PLAN.B.ex);
const REST_SEC=75, SESSION_MIN=45, STEP_KG=2.5, STEP_SEC=5;
let tab='today', histEx='goblet', rest=null, toastT=null;
let db=load();

function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.sessions))return x}catch(e){}return{sessions:[],draft:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save – storage blocked')}}
function h(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){let t=document.querySelector('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}
function fmtDate(iso){return new Date(iso).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function exById(id){return ALL.find(e=>e.id===id)}
function mmss(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

function inRamp(){
  if(!db.sessions.length)return true;
  const first=new Date(db.sessions[0].date);
  return (Date.now()-first.getTime())<14*864e5;
}
function targetSets(ex){return ex.sets}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d}
function sessionsThisWeek(){const ws=weekStart().getTime();return db.sessions.filter(s=>new Date(s.date).getTime()>=ws).length}

function lastFor(id){
  for(let i=db.sessions.length-1;i>=0;i--){
    const s=db.sessions[i],sets=(s.entries[id]||[]);
    if(sets.length)return{sets,date:s.date};
  }
  return null;
}
function fmtSets(ex,sets){
  if(ex.t==='sec')return sets.map(s=>s.r+'s').join(', ');
  const w=sets[0].w;
  const same=sets.every(s=>s.w===w);
  return same? w+' kg × '+sets.map(s=>s.r).join(', ') : sets.map(s=>s.w+'×'+s.r).join(', ');
}
function histFor(id,before){
  const out=[],end=before==null?db.sessions.length:before;
  for(let i=0;i<end;i++){const sets=db.sessions[i].entries[id];if(sets&&sets.length)out.push({sets,date:db.sessions[i].date})}
  return out;
}
function bestOf(list){let b=null;list.forEach(x=>x.sets.forEach(s=>{if(!b||s.w>b.w||(s.w===b.w&&s.r>b.r))b={w:s.w,r:s.r}}));return b}
function isPR(s,best){const w=parseFloat(s.w)||0,r=parseFloat(s.r)||0;return !!best&&w>0&&(w>best.w||(w===best.w&&r>best.r))}
function roundKg(x){return Math.round(x/STEP_KG)*STEP_KG}
function hitAll(ex,sets){return sets.length>=2&&sets.every(s=>s.r>=ex.reps)}
function suggest(ex){
  // Returns {msg, w}: w is a target weight the hint button can apply, or null.
  const hist=histFor(ex.id),last=hist[hist.length-1];if(!last)return null;
  const allHit=hitAll(ex,last.sets);
  if(ex.t==='sec'){
    const best=Math.max(...last.sets.map(s=>s.r));
    return{msg:allHit?'Hit all targets – try '+(best+STEP_SEC)+' s':'Aim for '+ex.reps+' s every set',w:null};
  }
  const top=Math.max(...last.sets.map(s=>s.w));
  if(allHit)return{msg:'Hit all reps – try '+(top+STEP_KG)+' kg',w:top+STEP_KG};
  const l3=hist.slice(-3);
  if(l3.length===3&&top>0&&l3.every(x=>Math.max(...x.sets.map(s=>s.w))===top&&!hitAll(ex,x.sets))){
    const dl=roundKg(top*0.9);
    if(dl<top)return{msg:'Stuck at '+top+' kg for 3 sessions – deload to '+dl+' kg and build back up',w:dl,deload:true};
  }
  return{msg:'Stay at '+top+' kg until every set hits '+ex.reps+' reps',w:null};
}
function plates(ex,w){
  w=parseFloat(w);if(!ex.bar||!(w>0))return '';
  let per=(w-ex.bar)/2;
  if(per<0)return '🧮 Below the '+ex.bar+' kg bar';
  if(per===0)return '🧮 Just the bar ('+ex.bar+' kg)';
  const out=[];for(const p of [25,20,15,10,5,2.5,1.25]){while(per>=p-1e-9){out.push(p);per-=p}}
  return '🧮 Per side ('+ex.bar+' kg bar): '+out.join(' + ')+(per>1e-9?' (+'+(+per.toFixed(2))+' kg not loadable)':'');
}
function startWeight(ex){
  const last=lastFor(ex.id);if(!last)return '';
  const allHit=last.sets.length>=2&&last.sets.every(s=>s.r>=ex.reps);
  const top=Math.max(...last.sets.map(s=>ex.t==='sec'?s.r:s.w));
  if(ex.t==='sec')return allHit?top+STEP_SEC:ex.reps;
  return allHit?top+STEP_KG:top;
}

function prefillSets(ex){
  // Copy last session's weight and reps set by set; extra sets repeat the last logged set.
  const last=lastFor(ex.id),n=targetSets(ex);
  if(!last)return Array.from({length:n},()=>({w:ex.t==='sec'?0:'',r:ex.reps,done:false}));
  const src=last.sets;
  return Array.from({length:Math.max(n,src.length)},(_,i)=>{const p=src[Math.min(i,src.length-1)];return{w:p.w,r:p.r,done:false}});
}
function startSession(type){
  const entries={};
  PLAN[type].ex.forEach(ex=>{entries[ex.id]=prefillSets(ex)});
  db.draft={type,start:Date.now(),entries};
  save();render();
}
function nextUndone(){
  const d=db.draft;if(!d||!PLAN[d.type])return null;
  for(const ex of PLAN[d.type].ex){const i=(d.entries[ex.id]||[]).findIndex(s=>!s.done);if(i>=0)return 'set-'+ex.id+'-'+i}
  return null;
}
function scrollToNext(){
  const id=nextUndone(),el=id?document.getElementById(id):document.querySelector('[data-act=finish]');
  if(!el)return;
  if(id){el.classList.add('next');setTimeout(()=>el.classList.remove('next'),1600)}
  try{el.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}
}
function finishSession(){
  const d=db.draft,entries={};let any=false;
  Object.keys(d.entries).forEach(id=>{
    const sets=d.entries[id].filter(s=>s.done).map(s=>({w:parseFloat(s.w)||0,r:parseFloat(s.r)||0}));
    if(sets.length){entries[id]=sets;any=true}
  });
  if(!any){if(!confirm('No sets ticked off. Discard this session?'))return;db.draft=null;save();render();return}
  let prs=0;Object.keys(entries).forEach(id=>{const ex=exById(id),best=bestOf(histFor(id));if(ex&&ex.t==='kg'&&entries[id].some(x=>isPR(x,best)))prs++});
  db.sessions.push({id:Date.now(),date:new Date(d.start).toISOString(),type:d.type,mins:Math.round((Date.now()-d.start)/60000),entries});
  db.draft=null;rest=null;save();tab='history';render();toast('Session saved 💪'+(prs?' · '+prs+' PR'+(prs>1?'s':'')+' 🏆':''));
}

function viewStart(){
  const n=sessionsThisWeek(),last=db.sessions[db.sessions.length-1];
  const next=last&&last.type==='A'?'B':'A',other=next==='A'?'B':'A';
  let html='<div class="card"><div class="row"><b>This week</b><span>'+n+' / 2</span></div><div class="bar"><i style="width:'+Math.min(100,n/2*100)+'%"></i></div>';
  html+='<div class="muted small">'+(inRamp()?'First 2 weeks: go light, stop every set with ~3 reps in the tank.':'Add weight once every set hits the rep target.')+'</div></div>';
  html+='<button class="big" data-act="start" data-type="'+next+'">Start '+PLAN[next].name+(last?' (up next)':'')+'</button>';
  html+='<button class="big alt" data-act="start" data-type="'+other+'">Start '+PLAN[other].name+'</button>';
  html+='<div class="card muted small">Flow: 5 min warm-up → lifts (rest ~75 s, timer starts when you tick a set) → ~8 min core and stretching. Total about '+SESSION_MIN+' min.</div>';
  return html;
}
function viewToday(){
  if(!db.draft)return viewStart();
  const d=db.draft,plan=PLAN[d.type];
  if(!plan){db.draft=null;save();return viewStart()}
  let fixed=false;
  plan.ex.forEach(ex=>{if(!Array.isArray(d.entries[ex.id])){d.entries[ex.id]=prefillSets(ex);fixed=true}});
  plan.ex.forEach(ex=>{const arr=d.entries[ex.id];while(arr.length<targetSets(ex)){const l=arr[arr.length-1]||{w:'',r:ex.reps};arr.push({w:l.w,r:ex.reps,done:false});fixed=true}});
  if(fixed)save();
  let html='<div class="card"><b>'+plan.name+'</b><span class="pill" id="elapsed">00:00</span><div class="muted small">Target: '+SESSION_MIN+' min incl. warm-up</div></div>';
  plan.ex.forEach(ex=>{
    const sets=d.entries[ex.id],last=lastFor(ex.id),sg=suggest(ex);
    html+='<div class="card"><div class="exh"><b>'+h(ex.n)+'</b><span class="muted small">'+targetSets(ex)+' × '+ex.reps+(ex.t==='sec'?' s':'')+' · '+mmss((ex.rest||REST_SEC)*1000)+' rest</span></div>';
    html+=last?'<div class="muted small">Last: '+h(fmtSets(ex,last.sets))+' ('+fmtDate(last.date)+')</div>':'<div class="muted small">First time – start light.</div>';
    const best=bestOf(histFor(ex.id));
    if(sg&&sg.w!=null&&!d.bumped?.[ex.id])html+='<button class="hint bump'+(sg.deload?' deload':'')+'" data-act="bump" data-ex="'+ex.id+'" data-w="'+sg.w+'">'+h(sg.msg)+' — tap to apply</button>';
    else if(sg&&!d.bumped?.[ex.id])html+='<div class="hint">'+h(sg.msg)+'</div>';
    sets.forEach((s,i)=>{
      const pr=s.done&&ex.t==='kg'&&isPR(s,best);
      html+='<div class="set'+(s.done?' done':'')+'" id="set-'+ex.id+'-'+i+'"><span class="n"'+(pr?' title="New PR"':'')+'>'+(pr?'🏆':(i+1))+'</span>';
      if(ex.t==='kg')html+='<input type="number" inputmode="decimal" step="0.5" data-ex="'+ex.id+'" data-i="'+i+'" data-k="w" value="'+h(s.w)+'" placeholder="kg"><span class="u">kg</span>';
      html+='<input type="number" inputmode="numeric" data-ex="'+ex.id+'" data-i="'+i+'" data-k="r" value="'+h(s.r)+'" placeholder="'+(ex.t==='sec'?'sec':'reps')+'"><span class="u">'+(ex.t==='sec'?'sec':'reps')+'</span>';
      html+='<button class="chk'+(s.done?' on':'')+'" data-act="tick" data-ex="'+ex.id+'" data-i="'+i+'">✓</button></div>';
    });
    if(ex.bar){const cur=(sets.find(x=>!x.done)||sets[0]||{}).w;html+='<div class="muted small plates" id="plates-'+ex.id+'">'+plates(ex,cur)+'</div>'}
    html+='<button class="ghost" data-act="addset" data-ex="'+ex.id+'">+ set</button></div>';
  });
  html+='<button class="big" data-act="finish">Finish session</button><button class="big alt danger" data-act="discard">Discard session</button>';
  return html;
}

function chartFor(id){
  const ex=exById(id),pts=[];
  db.sessions.forEach(s=>{
    const sets=s.entries[id];if(!sets||!sets.length)return;
    pts.push({d:s.date,v:Math.max(...sets.map(x=>ex.t==='sec'?x.r:x.w))});
  });
  if(pts.length<2)return '<div class="muted small">Need at least 2 logged sessions for a chart.</div>';
  const W=300,H=120,P=24,vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
  const x=i=>P+i*(W-2*P)/(pts.length-1),y=v=>H-P-(v-mn)/rg*(H-2*P);
  let path='M'+pts.map((p,i)=>x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' L');
  let s='<svg viewBox="0 0 '+W+' '+H+'"><path d="'+path+'" fill="none" stroke="#4ade80" stroke-width="2.5"/>';
  pts.forEach((p,i)=>{s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="3.5" fill="#4ade80"/><text x="'+x(i).toFixed(1)+'" y="'+(y(p.v)-8).toFixed(1)+'" font-size="9" fill="#8b91a0" text-anchor="middle">'+p.v+'</text>'});
  return s+'</svg><div class="muted small">Top '+(ex.t==='sec'?'time (s)':'weight (kg)')+' per session</div>';
}
function viewHistory(){
  let html='<div class="card"><b>Progress</b><div style="height:8px"></div><select id="exsel">'+ALL.map(e=>'<option value="'+e.id+'"'+(e.id===histEx?' selected':'')+'>'+h(e.n)+'</option>').join('')+'</select>'+chartFor(histEx)+'</div>';
  if(!db.sessions.length)return html+'<div class="card muted">No sessions yet.</div>';
  db.sessions.slice().reverse().forEach(s=>{
    if(!PLAN[s.type])return;
    html+='<div class="card"><div class="row"><b>'+fmtDate(s.date)+' · '+PLAN[s.type].name+'</b><span class="muted small">'+s.mins+' min</span></div>';
    const idx=db.sessions.indexOf(s);
    PLAN[s.type].ex.forEach(ex=>{const sets=s.entries[ex.id];if(sets){const best=bestOf(histFor(ex.id,idx)),pr=ex.t==='kg'&&sets.some(x=>isPR(x,best));html+='<div class="small"><span class="muted">'+h(ex.n.replace(/ \(.*\)/,''))+':</span> '+h(fmtSets(ex,sets))+(pr?' 🏆':'')+'</div>'}});
    html+='<button class="ghost danger" data-act="del" data-id="'+s.id+'">Delete</button></div>';
  });
  return html;
}
function viewData(){
  return '<div class="card"><b>Backup</b><div class="muted small" style="margin:4px 0 8px">Data lives only in this browser. Export now and then so a cleared cache does not wipe your history.</div>'
  +'<button class="big" data-act="export">Export JSON</button>'
  +'<button class="big alt" data-act="import">Import JSON</button><input type="file" id="file" accept="application/json" style="display:none">'
  +'<button class="big alt danger" data-act="reset">Delete all data</button></div>'
  +'<div class="muted small" style="text-align:center">Gym Log v'+APP_VERSION+'</div>';
}

function render(){
  document.getElementById('tabs').innerHTML=[['today','Today'],['history','History'],['data','Data']].map(t=>'<button data-act="tab" data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('');
  document.getElementById('view').innerHTML=tab==='today'?viewToday():tab==='history'?viewHistory():viewData();
  tick();
}
function tick(){
  const el=document.getElementById('elapsed');
  if(el&&db.draft)el.textContent=mmss(Date.now()-db.draft.start);
  const rb=document.getElementById('restbar');
  if(rest){
    const left=rest.end-Date.now();
    if(left<=0){
      rest=null;rb.classList.remove('on');
      try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},300)}catch(e){}
      try{navigator.vibrate&&navigator.vibrate(250)}catch(e){}
    }else{rb.classList.add('on');rb.textContent='Rest '+mmss(left)+'  (tap to skip)'}
  }else rb.classList.remove('on');
}
setInterval(tick,1000);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='tab'){tab=b.dataset.t;render()}
  else if(a==='start')startSession(b.dataset.type);
  else if(a==='tick'){
    const s=db.draft.entries[b.dataset.ex][+b.dataset.i];s.done=!s.done;
    if(s.done)rest={end:Date.now()+(exById(b.dataset.ex).rest||REST_SEC)*1000};else rest=null;
    save();render();
    if(s.done)scrollToNext();
  }
  else if(a==='addset'){
    const arr=db.draft.entries[b.dataset.ex],l=arr[arr.length-1]||{w:'',r:''};
    arr.push({w:l.w,r:l.r,done:false});save();render();
  }
  else if(a==='bump'){
    const ex=exById(b.dataset.ex),w=parseFloat(b.dataset.w);
    db.draft.entries[ex.id].forEach(s=>{if(!s.done){s.w=w;s.r=ex.reps}});
    (db.draft.bumped=db.draft.bumped||{})[ex.id]=true;save();render();toast(ex.n.replace(/ \(.*\)/,'')+': '+w+' kg');
  }
  else if(a==='finish')finishSession();
  else if(a==='discard'){if(confirm('Discard this session?')){db.draft=null;rest=null;save();render()}}
  else if(a==='del'){if(confirm('Delete this session?')){db.sessions=db.sessions.filter(s=>String(s.id)!==b.dataset.id);save();render()}}
  else if(a==='export'){
    const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');
    l.href=u;l.download='gym-log-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
  }
  else if(a==='import')document.getElementById('file').click();
  else if(a==='reset'){if(confirm('Delete ALL sessions? This cannot be undone.')){db={sessions:[],draft:null};rest=null;save();render()}}
});
document.addEventListener('click',e=>{if(e.target.id==='restbar'){rest=null;tick()}});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.k||!db.draft)return;
  db.draft.entries[t.dataset.ex][+t.dataset.i][t.dataset.k]=t.value;save();
  const pl=document.getElementById('plates-'+t.dataset.ex);if(pl&&t.dataset.k==='w')pl.textContent=plates(exById(t.dataset.ex),t.value);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='exsel'){histEx=t.value;render()}
  else if(t.id==='file'&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.sessions))throw 0;
      if(confirm('Replace current data with the imported file?')){db={sessions:x.sessions,draft:null};save();render();toast('Imported')}}
      catch(err){toast('Not a valid Gym Log file')}};
    r.readAsText(t.files[0]);
  }
});
document.getElementById('ver').textContent='v'+APP_VERSION;
render();
</script>
</body>
</html>
